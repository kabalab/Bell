<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d214a" />
  <title>PHHS Schedule</title>
  <style>
    :root{
      --bg1:#071327;
      --bg2:#0d214a;
      --bg3:#153571;
      --accent:#4c7dff;
      --text:#e6eeff;
      --warn:#ffcc66;
      --ok:#8fb3ff;
      --density:1;
    }

    *{box-sizing:border-box;}
    html,body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      touch-action:manipulation;
      -webkit-text-size-adjust:100%;
    }
    body{
      font-family:'Segoe UI',sans-serif;color:var(--text);
      background:
        radial-gradient(1200px 800px at 20% 10%, rgba(76,125,255,.16), transparent 60%),
        radial-gradient(1000px 700px at 85% 85%, rgba(143,179,255,.13), transparent 60%),
        linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3));
      display:flex;justify-content:center;align-items:center;position:relative;isolation:isolate;
      animation:skyBreath 18s ease-in-out infinite alternate;
    }

    #schoolPicker{
      display:none;
      text-align:center;
    }
    #schoolPicker .actions{
      justify-content:center;
      margin-top:18px;
    }
    #comboBuilder{
      display:none;
      margin-top:18px;
      padding:14px;
      border-radius:14px;
      background:rgba(0,0,0,.25);
    }
    #comboBuilder.show{display:block;}
    #comboSchools{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      gap:8px;
      margin-top:10px;
    }
    #comboSchools button{
      width:100%;
      margin:0;
      border-radius:12px;
    }
    #comboOrder{
      margin-top:14px;
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .combo-order-item{
      display:flex;
      align-items:center;
      gap:8px;
      padding:9px 10px;
      border-radius:10px;
      background:rgba(255,255,255,.1);
    }
    .combo-order-item span{flex:1;}
    .combo-order-item button{
      min-height:36px;
      padding:6px 10px;
      margin:0;
      border-radius:9px;
    }
    .combo-empty{
      opacity:.7;
      text-align:center;
      padding:8px;
    }
    #schoolStack{
      display:none;
      width:min(980px,96vw);
      max-height:94dvh;
      min-height:280px;
      background:linear-gradient(145deg, color-mix(in oklab, var(--bg1) 78%, #0a0f1e 22%), color-mix(in oklab, var(--bg2) 80%, #0a0f1e 20%) 55%, color-mix(in oklab, var(--bg3) 82%, #0a0f1e 18%));
      box-shadow:0 20px 60px rgba(0,0,0,.6);
      padding:24px;
      border-radius:22px;
      overflow:auto;
    }
    #schoolStack .stack-title{
      display:none;
    }
    .school-stack-item{
      margin:0;
      padding:18px 0;
      border-radius:0;
      overflow:visible;
      background:transparent;
      box-shadow:none;
    }
    .school-stack-item + .school-stack-item{
      border-top:1px solid rgba(255,255,255,.16);
    }
    .school-stack-frame{
      display:block;
      width:100%;
      min-height:520px;
      height:620px;
      border:0;
      background:transparent;
    }
    body.stack-mode{
      overflow:auto;
      align-items:flex-start;
      padding:18px 0;
    }

    .embedded-school-title{display:none;}
    body.embedded-mode{
      height:auto;
      min-height:0;
      overflow:visible;
      align-items:flex-start;
      background:transparent;
      animation:none;
      padding:0;
    }
    body.embedded-mode .container{
      width:100%;
      max-height:none;
      min-height:0;
      padding:0;
      border-radius:0;
      box-shadow:none;
      background:transparent;
      overflow:visible;
    }
    body.embedded-mode .embedded-school-title{
      display:block;
      font-size:2.1em;
      margin:0 0 8px;
      line-height:1.2;
    }
    body.embedded-mode #currentPeriod{
      font-size:2.1em;
      margin:0 0 4px;
    }
    body.embedded-mode #endTime{
      font-size:1.5em;
      margin:0 0 4px;
    }
    body.embedded-mode #countdown{
      font-size:.95em;
      margin:0 0 4px;
    }
    body.embedded-mode #mainContainer{
      display:block;
    }

    .container{
      position:relative;
      z-index:2;
      background:linear-gradient(145deg, color-mix(in oklab, var(--bg1) 78%, #0a0f1e 22%), color-mix(in oklab, var(--bg2) 80%, #0a0f1e 20%) 55%, color-mix(in oklab, var(--bg3) 82%, #0a0f1e 18%));
      backdrop-filter:none;
      width:min(980px,96vw);
      max-height:94dvh;
      min-height:280px;
      overflow:hidden;
      padding:24px;
      border-radius:22px;
      box-shadow:0 20px 60px rgba(0,0,0,.6);
      transition:max-height .25s ease, height .25s ease, background .35s linear;
    }

    .container.allow-scroll{overflow:auto;}

    h1{margin:0;font-size:2.1em}
    h2{margin:8px 0 4px;font-weight:400;opacity:.9}
    #countdown{font-size:.95em;opacity:.9}
    #currentPeriod{transition:transform .2s ease,text-shadow .25s ease,opacity .2s ease;}
    .period-flash{animation:periodFlash .45s ease;}
    .top-grid{display:grid;grid-template-columns:1fr;gap:16px}
    .top-grid.calendar-visible{grid-template-columns:1.2fr 1fr}
    @media (max-width:860px){.top-grid.calendar-visible{grid-template-columns:1fr}}

    .actions{display:flex;flex-wrap:wrap;gap:2px}
    button{
      margin:2px 0 0;
      padding:9px 14px;
      border:none;
      border-radius:30px;
      cursor:pointer;
      background:var(--accent);
      color:#fff;
      font-size:.93em;
      transition:transform .12s ease,box-shadow .2s ease,filter .2s ease;
    }
    button:hover{filter:brightness(1.08);transform:translateY(-1px)}
    button:active{transform:scale(0.97)}

    .panel{
      margin-top:14px;
      max-height:0;
      overflow:hidden;
      opacity:0;
      padding:0 14px;
      border-radius:12px;
      background:rgba(0,0,0,.35);
      transition:max-height .6s ease,opacity .35s ease,padding .25s ease;
    }
    .panel.show{max-height:1300px;opacity:1;padding:14px}
    .schedule-item{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.12)}
    .schedule-item:last-child{border-bottom:none}
    .holiday{color:var(--warn);font-size:1.16em}
    .badge{font-size:.76rem;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.18);margin-left:8px}

    .schedule-link{
      width:100%;
      text-align:left;
      margin:2px 0;
      padding:10px 12px;
      border-radius:10px;
      background:rgba(255,255,255,.16);
      transition:transform .18s ease, background .22s ease, box-shadow .22s ease;
    }
    .schedule-link:hover{transform:translateY(-1px);background:rgba(255,255,255,.22)}
    .schedule-link.active-btn{background:rgba(76,125,255,.52);border:1px solid rgba(255,255,255,.45)}
    .schedule-link.click-animate{animation:scheduleButtonClick .42s ease}

    .inline-detail{
      margin:2px 0 10px 0;
      border-radius:10px;
      background:rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.2);
      overflow:hidden;
      max-height:0;
      opacity:0;
      transform:translateY(-8px);
      transition:max-height .36s ease,opacity .26s ease,transform .26s ease,padding .22s ease;
      padding:0 12px;
    }
    .inline-detail.show{max-height:700px;opacity:1;transform:translateY(0);padding:10px 12px}

    .calendar-card{background:rgba(0,0,0,.28);border-radius:14px;padding:12px}
    .calendar-card.hidden{display:none}
    .cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .cal-nav{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:8px;padding:4px 8px;margin-left:4px}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
    .cal-dow{text-align:center;font-size:.75rem;opacity:.8}
    .cal-day{
      border:none;border-radius:8px;min-height:38px;color:#fff;background:rgba(255,255,255,.12);
      cursor:pointer;font-size:.82rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    }
    .cal-day.muted{opacity:.35;cursor:default;background:rgba(255,255,255,.06)}
    .cal-day.today{outline:2px solid #8fb3ff}
    .cal-day.selected{outline:2px solid #fff}
    .cal-day.filled-finals{background:rgba(255,111,111,.35)}
    .cal-day.filled-rally{background:rgba(102,169,255,.35)}
    .cal-day.filled-noschool{background:rgba(255,204,102,.4)}
    .cal-day.filled-multi{background:linear-gradient(135deg,rgba(255,111,111,.35),rgba(102,169,255,.32),rgba(255,204,102,.4))}
    .event-dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
    .event-dot{width:6px;height:6px;border-radius:50%;background:#fff;opacity:.9;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
    .legend{margin-top:8px;font-size:.75rem;display:flex;gap:12px;flex-wrap:wrap}
    .legend-swatch{width:12px;height:12px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
    #calendarInfo{margin-top:10px;font-size:.85rem;line-height:1.35}
    .event-list{margin-top:8px}
    .event-item{padding:4px 0;border-bottom:1px solid rgba(255,255,255,.1)}
    .event-item:last-child{border-bottom:none}
    .event-time{font-weight:600;margin-right:6px;opacity:.9}

    @media (max-width:700px){
      .container{
        width:100vw;
        max-height:100dvh;
        min-height:100dvh;
        border-radius:0;
        box-shadow:none;
        padding-top:12px;
        padding-left:max(12px, env(safe-area-inset-left));
        padding-right:max(12px, env(safe-area-inset-right));
        padding-bottom:max(16px, env(safe-area-inset-bottom));
      }

      .top-grid,
      .top-grid.calendar-visible{
        grid-template-columns:1fr !important;
        gap:10px;
      }

      h1{
        font-size:1.35rem;
        line-height:1.2;
        letter-spacing:.2px;
      }

      h2{
        font-size:.92rem;
        margin:6px 0 3px;
        opacity:.95;
      }

      #countdown{
        font-size:.9rem;
        opacity:.95;
      }

      .actions{
        display:grid;
        grid-template-columns:1fr;
        gap:8px;
        margin-top:8px;
      }

      .actions button{
        width:100%;
        margin:0;
        border-radius:12px;
        padding:11px 12px;
        font-size:.92rem;
        font-weight:600;
      }

      .panel{
        margin-top:8px;
        border-radius:10px;
      }

      .panel.show{
        padding:12px;
      }

      .schedule-item{
        font-size:.9rem;
        line-height:1.35;
        padding:7px 0;
      }

      .schedule-link{
        font-size:.9rem;
        border-radius:10px;
        padding:10px;
      }

      .inline-detail.show{
        padding:8px 10px;
      }

      .calendar-card{
        padding:10px;
        border-radius:12px;
      }

      .cal-header{
        margin-bottom:6px;
      }

      #calTitle{
        font-size:.95rem;
        font-weight:600;
      }

      .cal-nav{
        padding:6px 8px;
        border-radius:8px;
      }

      .cal-grid{
        gap:4px;
      }

      .cal-dow{
        font-size:.68rem;
      }

      .cal-day{
        min-height:44px;
        font-size:.76rem;
        border-radius:7px;
        padding:0;
      }

      .legend{
        font-size:.68rem;
        gap:7px;
      }

      #calendarInfo{
        margin-top:8px;
        font-size:.86rem;
        line-height:1.28;
      }

      body{
        padding-bottom:env(safe-area-inset-bottom);
      }

      body.embedded-mode .embedded-school-title{
        font-size:1.35rem;
      }
      body.embedded-mode #currentPeriod{
        font-size:1.35rem;
      }
      body.embedded-mode #endTime{
        font-size:1rem;
      }
    }

    @media (max-width:380px){
      h1{font-size:1.2rem;}
      h2,#countdown{font-size:.84rem;}
      .cal-day{font-size:.72rem;}
    }

    button,.cal-day,.schedule-link,.cal-nav{min-height:44px;}

    @keyframes periodFlash{
      0%{transform:scale(1);opacity:.85;text-shadow:0 0 0 rgba(143,179,255,0)}
      35%{transform:scale(1.04);opacity:1;text-shadow:0 0 14px rgba(143,179,255,.7)}
      100%{transform:scale(1);opacity:1;text-shadow:0 0 0 rgba(143,179,255,0)}
    }
    @keyframes scheduleButtonClick{
      0%{transform:scale(1);box-shadow:0 0 0 rgba(76,125,255,0)}
      35%{transform:scale(1.04);box-shadow:0 0 20px rgba(76,125,255,.55)}
      70%{transform:scale(.99);box-shadow:0 0 10px rgba(76,125,255,.28)}
      100%{transform:scale(1);box-shadow:0 0 0 rgba(76,125,255,0)}
    }
    @keyframes skyBreath{0%{filter:brightness(1)}100%{filter:brightness(1.06)}}

    @media (prefers-reduced-motion: reduce){
      body{animation:none !important}
    }
  </style>
</head>
<body>
  <div class="container" id="schoolPicker">
    <div>
      <h1>Choose Your School</h1>
      <h2>Select a school to view its schedule.</h2>
      <div class="actions" id="schoolButtons"></div>
      <div class="actions">
        <button type="button" onclick="toggleComboBuilder()">Build School Combination</button>
      </div>

      <div id="comboBuilder">
        <div><strong>Choose schools in the order you want them loaded.</strong></div>
        <div style="opacity:.8;margin-top:4px;font-size:.9em;">Each click adds that school to the bottom of the list.</div>
        <div id="comboSchools"></div>
        <div id="comboOrder"></div>
        <div class="actions" style="justify-content:center;margin-top:12px;">
          <button type="button" onclick="clearComboSelection()">Clear</button>
          <button type="button" onclick="openComboSelection()">Open Combination</button>
          <button type="button" onclick="toggleComboBuilder()">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <div class="container" id="schoolStack">
    <div class="stack-title">
      <h1 id="schoolStackTitle">School Schedules</h1>
      <h2>Loaded in the same order as the URL.</h2>
    </div>
    <div id="schoolStackItems"></div>
  </div>

  <div class="container" id="mainContainer" style="display:none;">
    <div class="top-grid" id="topGrid">
      <div>
        <h1 id="schoolNameHeader" class="embedded-school-title"></h1>
        <h1 id="currentPeriod">Loading...</h1>
        <h2 id="endTime"></h2>
        <div id="countdown"></div>

        <div class="actions">
          <button onclick="toggleToday()">Today's Schedule</button>
          <button onclick="toggleAll()">All Schedules</button>
          <button onclick="toggleCalendar()" id="calendarToggleBtn">Show Calendar</button>
        </div>

        <div class="panel" id="devPanel">
          <div class="schedule-item"><strong>Dev Time Override</strong></div>
          <div class="schedule-item">
            <!-- <label for="devTimeInput">HHMMSS:</label> -->
            <input id="devTimeInput" type="text" placeholder="HHMMSS" maxlength="6" style="margin-left:8px; width:110px; padding:6px; border-radius:8px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.1); color:#fff;">
          </div>
          <div class="actions">
            <button onclick="setDevTime()">Set Time</button>
            <button onclick="resetDevTime()">Reset Time</button>
          </div>
        </div>

        <div id="todayPanel" class="panel"></div>
        <div id="allPanel" class="panel"></div>
      </div>

      <div class="calendar-card hidden" id="calendarCard">
        <div class="cal-header">
          <div id="calTitle">Month YYYY</div>
          <div>
            <button class="cal-nav" onclick="changeMonth(-1)">◀</button>
            <button class="cal-nav" onclick="goToCurrentMonth()">Today</button>
            <button class="cal-nav" onclick="changeMonth(1)">▶</button>
          </div>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="legend">
          <span><span class="legend-swatch" style="background:rgba(255,111,111,.35)"></span>Finals</span>
          <span><span class="legend-swatch" style="background:rgba(102,169,255,.35)"></span>Pep Rally</span>
          <span><span class="legend-swatch" style="background:rgba(255,204,102,.40)"></span>No School</span>
        </div>
        <div id="calendarInfo"></div>
      </div>
    </div>
  </div>

  <script>
    /* ================================================================
       SCHOOL CONFIGURATION
       Add a school in SCHOOL_CONFIGS. Anything not supplied there
       automatically comes from DEFAULT_CONFIG.
       ================================================================ */

    const DEFAULT_CONFIG={
      name:"School",
      title:"School",

      calendar:{
        url:"https://r.jina.ai/http://calendar.google.com/calendar/ical/patrickhenryhs.net_l9rvi05c4sq4qk48dklvmvjc40@group.calendar.google.com/public/basic.ics",
        show:false,
        useForSchoolYear:true
      },

      keywords:{
          firstDay:[{all:["day","school"],any:["first","1st"]}],
          lastDay:[{all:["last","day","school"]}],
          noSchool:["no school"],
          thanksgivingBreak:["thanksgiving break"],
          winterBreak:["winter break"]
        },

      defaults:{
        schoolYearEndFromNextFirstDay:true,
        breakWeekdays:5
      },

      schedule:{
        regularTF:{title:"Daily Schedule (Tue–Fri)",blocks:[["Period 1","08:45","09:42"],["Period 2","09:48","10:45"],["Period 3","10:51","11:48"],["Period 4","11:54","12:51"],["Lunch","12:57","13:27"],["Period 5","13:33","14:30"],["Period 6","14:36","15:33"]]},
        mondayBroadcast:{title:"Monday Late Start (with Broadcast News)",blocks:[["Period 1","09:20","10:10"],["Period 2","10:16","11:06"],["Period 3","11:12","12:02"],["Period 4","12:08","12:58"],["Lunch","13:04","13:34"],["Period 5","13:40","14:39"],["Period 6","14:45","15:35"]]},
        pepRally:{title:"Pep Rally Schedule",blocks:[["Period 1","08:45","09:32"],["Period 2","09:38","10:25"],["Period 3","10:31","11:18"],["Rally","11:25","12:17"],["Period 4","12:24","13:11"],["Lunch","13:17","13:47"],["Period 5","13:53","14:40"],["Period 6","14:46","15:33"]]}
      },

      logic:{
        getScheduleKeyForDate:null
      }
    };

    const SCHOOL_CONFIGS={
      phhs:{
        name:"Patrick Henry High School",
        title:"Patrick Henry ",
        calendar:{show:true},
        schedule:{
          mondayBroadcast:{title:"Monday Late Start (with PHHS Broadcast News)",blocks:[["Period 1","09:20","10:10"],["Period 2","10:16","11:06"],["Period 3","11:12","12:02"],["Period 4","12:08","12:58"],["Lunch","13:04","13:34"],["Period 5","13:40","14:39"],["Period 6","14:45","15:35"]]},
          mondayNoBroadcast:{title:"Monday Late Start (w/o Broadcast: first 3 Mondays)",blocks:[["Period 1","09:20","10:11"],["Period 2","10:17","11:08"],["Period 3","11:14","12:05"],["Period 4","12:11","13:02"],["Lunch","13:08","13:41"],["Period 5","13:47","14:38"],["Period 6","14:44","15:35"]]},
          pepRally:{title:"Pep Rally Schedule"},
          finalsP12:{title:"Minimum Day Finals (P1 & P2)",blocks:[["Period 1 Final","08:45","10:45"],["Period 2 Final","11:11","13:11"]]},
          finalsP34:{title:"Minimum Day Finals (P3 & P4)",blocks:[["Period 3 Final","08:45","10:45"],["Period 4 Final","11:11","13:11"]]},
          finalsP56:{title:"Minimum Day Finals (P5 & P6)",blocks:[["Period 5 Final","08:45","10:45"],["Period 6 Final","11:11","13:11"]]}
        },
      },
      
      plhs:{
        name:"Point Loma high school",
        title:"Point Loma high ",
        schedule:{
          regularTF:{
            title:"Classic Schedule",blocks:[["Period 1","08:45","09:42"],["Period 2","09:47","10:44"],["Period 3","10:49","11:49"],["Lunch","11:54","12:24"],["Period 4","12:29","13:26"],["Period 5","13:31","14:28"],["Period 6","14:33","15:30"]]},
          mondayBroadcast:{
            title:"Modified Mondays",blocks:[["Period 1","08:45","09:34"],["Period 2","09:39","10:28"],["Period 3","10:33","11:23"],["Lunch","11:28","12:58"],["Period 4","12:03","12:52"],["Period 5","12:57","13:46"],["Period 6","13:51","14:40"]]},
          pepRally:{
            title:"Activity Calendar (pep rallies)",blocks:[["Period 1","08:45","09:37"],["Period 2","09:42","10:34"],["Period 3","10:39","11:34"],["Activity","11:39","12:04"],["Lunch","12:09","12:34"],["Period 4","12:44","13:36"],["Period 5","13:41","14:33"],["Period 6","14:38","15:30"]]}, 
          finalsP123:{
            title:"Finals P1,P2,P3 Schedule",blocks:[["Period 1","08:45","10:30"],["Period 2","10:35","12:20",],["Lunch","12:25","12:55"],["Period 3","13:00","14:45"]]},
          finalsP456:{
            title:"Finals P4,P5,P6 Schedule",blocks:[["Period 4","08:45","10:30"],["Period 5","10:35","12:20",],["Lunch","12:25","12:55"],["Period 6","13:00","14:45"]]},},
      },

      rchs:{
        name:"Rancho Cucamonga High School",
        title:"Rancho Cucamonga ",
        schedule:{
          regularTF:{
            title:"Regular Schedule",blocks:[["Period 0","07:20","08:23"],["Period 1","08:30","09:26"],["Period 2","09:33","10:38"],["Period 3","10:45","11:41"],["1st Lunch","11:41","12:11"],["Period 4","11:48","12:44"],["Period 4","12:44","13:14"],["2nd Lunch","12:44","13:14"],["Period 5","13:21","14:17"],["Period 6","14:24","15:20"]],},
          mondayBroadcast:{
            title:"Friday Confrence Schedule",blocks:[["Period 1","09:30","09:17"],["Period 2","10:24","11:11"],["Period 3","11:18","12:05"],["1st Lunch","12:05","12:35"],["Period 4","12:42","13:30"],["Period 4","12:12","13:00"],["2nd Lunch","13:00","13:30"],["Period 5","13:37","14:25"],["Period 6","14:32","15:20"]],}, 
          minimumDay:{

    function mergeConfig(base,override){
      if(override===undefined) return base;
      if(Array.isArray(base) || Array.isArray(override)) return override===undefined?base:override;
      if(base && typeof base==="object" && override && typeof override==="object"){
        const out={...base};
        for(const [key,value] of Object.entries(override)) out[key]=mergeConfig(base[key],value);
        return out;
      }
      return override;
    }

    function getSchoolConfig(slug){
      return mergeConfig(DEFAULT_CONFIG,SCHOOL_CONFIGS[slug]||{});
    }

    const SCHOOL_ROUTES=Object.fromEntries(
      Object.entries(SCHOOL_CONFIGS).map(([slug,school])=>[slug,{name:school.name||slug,title:school.title||school.name||slug}])
    );

    let activeSchoolSlug=null;
    let activeSchoolConfig=null;
    let comboSelection=[];

    function getLastRoutePart(){
      const parts=location.pathname.split("/").filter(Boolean);
      return (parts[parts.length-1]||"").toLowerCase().replace(/\.html$/i,"");
    }

    function getCurrentSchoolStack(){
      const raw=getLastRoutePart();
      if(!raw||!raw.includes("-"))return [];
      const slugs=raw.split("-").filter(Boolean);
      if(slugs.length<2)return [];
      return slugs.every(slug=>Object.prototype.hasOwnProperty.call(SCHOOL_ROUTES,slug))?slugs:[];
    }

    function getCurrentSchoolSlug(){
      const stack=getCurrentSchoolStack();
      if(stack.length)return null;
      const slug=getLastRoutePart();
      return Object.prototype.hasOwnProperty.call(SCHOOL_ROUTES,slug)?slug:null;
    }

    function isKnownRoutePart(value){
      if(Object.prototype.hasOwnProperty.call(SCHOOL_ROUTES,value))return true;
      const slugs=value.split("-").filter(Boolean);
      return slugs.length>=2 && slugs.every(slug=>Object.prototype.hasOwnProperty.call(SCHOOL_ROUTES,slug));
    }

    function getAppBasePath(){
      const raw=location.pathname.replace(/\/+$/g,"");
      const parts=raw.split("/").filter(Boolean);
      const last=(parts[parts.length-1]||"").toLowerCase().replace(/\.html$/i,"");
      if(last && isKnownRoutePart(last))parts.pop();
      if(parts[parts.length-1]==="index")parts.pop();
      return "/"+parts.join("/");
    }

    function selectSchool(slug){
      if(!Object.prototype.hasOwnProperty.call(SCHOOL_ROUTES,slug))return;

    function routeSchool(){

    const devMode=new URLSearchParams(location.search).get("dev")==="1";
    const embeddedMode=new URLSearchParams(location.search).get("embed")==="1";
    if(embeddedMode)document.body.classList.add("embedded-mode");
    let devTimeOffsetMs=0;
    let devTimeActive=false;

    let currentDensity=1;
    let reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let calendarEventsByDate=new Map();
    let calendarEvents=[];
    let calendarDataLoaded=false;
    let yearDataCache=new Map();

    function getNow(){

    function formatDate(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
    function parseTimeToMinutes(hhmm){const [h,m]=hhmm.split(":").map(Number);return h*60+m;}
    function toNormalTime(hhmm){const [h,m]=hhmm.split(":").map(Number);const ap=h>=12?"PM":"AM";let hr=h%12;if(hr===0)hr=12;return `${hr}:${String(m).padStart(2,"0")} ${ap}`;}
    function prettyDate(s){return new Date(s+"T00:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
    function fullDate(s){return new Date(s+"T00:00:00").toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});}
    function nthWeekday(year,month,weekday,n){const first=new Date(year,month,1);let off=(7+weekday-first.getDay())%7;off+=7*(n-1);return new Date(year,month,1+off);}
    function lastWeekday(year,month,weekday){const last=new Date(year,month+1,0);const off=(7+last.getDay()-weekday)%7;return new Date(year,month+1,0-off);}
    function getPeriodLabel(name){const m=name.match(/Period\s+\d+/i);return m?m[0]:name;}
    function formatDuration(totalSeconds){totalSeconds=Math.max(0,Math.floor(totalSeconds));const h=Math.floor(totalSeconds/3600),m=Math.floor((totalSeconds%3600)/60),s=totalSeconds%60;return h>0?`${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${m}:${String(s).padStart(2,"0")}`;}

    function escapeHtml(str){
      return str.replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;", "'":"&#39;"}[c]));
    }

    function parseIcsDate(value){
      if(!value) return null;
      if(/^\d{8}$/.test(value)){
        const y=Number(value.slice(0,4)),m=Number(value.slice(4,6)),d=Number(value.slice(6,8));
        return {date:new Date(y,m-1,d),allDay:true};
      }
      if(/^\d{8}T\d{6}Z$/.test(value)){
        const iso=`${value.slice(0,4)}-${value.slice(4,6)}-${value.slice(6,8)}T${value.slice(9,11)}:${value.slice(11,13)}:${value.slice(13,15)}Z`;
        return {date:new Date(iso),allDay:false};
      }
      if(/^\d{8}T\d{6}$/.test(value)){
        const y=Number(value.slice(0,4)),m=Number(value.slice(4,6)),d=Number(value.slice(6,8));
        const h=Number(value.slice(9,11)),mi=Number(value.slice(11,13)),s=Number(value.slice(13,15));
        return {date:new Date(y,m-1,d,h,mi,s),allDay:false};
      }
      return null;
    }

    function parseIcs(text){
      const raw=text.replace(/\r/g,"").split("\n"),lines=[];
      for(const line of raw){
        if(line.startsWith(" ")||line.startsWith("\t")){
          if(lines.length) lines[lines.length-1]+=line.trim();
        }else lines.push(line.trim());
      }
      const events=[];let current=null;
      for(const line of lines){
        if(line==="BEGIN:VEVENT"){current={};continue;}
        if(line==="END:VEVENT"){if(current?.start)events.push(current);current=null;continue;}
        if(!current)continue;
        const idx=line.indexOf(":");if(idx===-1)continue;
        const key=line.slice(0,idx),value=line.slice(idx+1);
        if(key.startsWith("SUMMARY"))current.summary=value.trim();
        if(key.startsWith("DTSTART")){const parsed=parseIcsDate(value.trim());if(parsed){current.start=parsed.date;current.allDay=parsed.allDay;}}
        if(key.startsWith("DTEND")){const parsed=parseIcsDate(value.trim());if(parsed)current.end=parsed.date;}
      }
      return events;
    }

    function normalizeEventTitle(text){
      return String(text||"").toLowerCase().replace(/[–—]/g,"-").replace(/\s+/g," ").trim();
    }

    function matchesKeywordRule(title,rule){
      if(typeof rule==="string") return title.includes(normalizeEventTitle(rule));
      if(!rule||typeof rule!=="object") return false;
      const all=Array.isArray(rule.all)?rule.all:[];
      const any=Array.isArray(rule.any)?rule.any:[];
      return all.every(word=>title.includes(normalizeEventTitle(word))) && (!any.length || any.some(word=>title.includes(normalizeEventTitle(word))));
    }

    function matchesConfiguredKeywords(evt,key){
      const title=normalizeEventTitle(evt.summary);
      const rules=activeSchoolConfig?.keywords?.[key]||[];
      return rules.some(rule=>matchesKeywordRule(title,rule));
    }

    function isNoSchoolEvent(evt){return matchesConfiguredKeywords(evt,"noSchool");}
    function isFirstDayOfSchoolEvent(evt){return matchesConfiguredKeywords(evt,"firstDay");}
    function isThanksgivingBreakEvent(evt){return matchesConfiguredKeywords(evt,"thanksgivingBreak");}
    function isWinterBreakEvent(evt){return matchesConfiguredKeywords(evt,"winterBreak");}
    function isLastDayOfSchoolEvent(evt){return matchesConfiguredKeywords(evt,"lastDay");}

    function addWeekdaysFromStart(startDate,count){
      const dates=[];
      const d=new Date(startDate.getFullYear(),startDate.getMonth(),startDate.getDate());
      while(dates.length<count){
        const day=d.getDay();
        if(day!==0&&day!==6)dates.push(formatDate(d));
        d.setDate(d.getDate()+1);
      }
      return dates;
    }

    function indexCalendarEvents(events){
      calendarEvents=events.slice();
      calendarEventsByDate=new Map();
      for(const evt of events){
        const dateStr=formatDate(evt.start);
        const timeLabel=evt.allDay?"":evt.start.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
        const item={summary:evt.summary||"Event",dateStr,startMs:evt.start.getTime(),allDay:evt.allDay,timeLabel};
        if(!calendarEventsByDate.has(dateStr))calendarEventsByDate.set(dateStr,[]);
        calendarEventsByDate.get(dateStr).push(item);
      }
      for(const [key,arr] of calendarEventsByDate)arr.sort((a,b)=>a.startMs-b.startMs);
      calendarDataLoaded=true;
      yearDataCache.clear();
    }

    function loadCalendarEvents(){
      const cal=activeSchoolConfig?.calendar||{};
      const shouldLoad=Boolean(cal.url) && (cal.show===true || cal.useForSchoolYear===true);
      const shouldUseForSchoolYear=cal.useForSchoolYear===true;

      if(!shouldLoad){
        indexCalendarEvents([]);
        renderCalendar();
        update();
        return;
      }

      calendarDataLoaded=false;
      fetch(cal.url)
        .then(res=>{if(!res.ok)throw new Error(`Calendar request failed: ${res.status}`);return res.text();})
        .then(text=>{
          const events=parseIcs(text);
          indexCalendarEvents(shouldUseForSchoolYear?events:[]);
          if(cal.show===true){
            indexCalendarEvents(events);
          }else{
            calendarEventsByDate=new Map();
          }
          renderCalendar();
          if(selectedDateStr)showCalendarInfo(selectedDateStr);
          update();
        })
        .catch(()=>{
          indexCalendarEvents([]);
          renderCalendar();
          update();
        });
    }

    function setMainLabel(nextLabel){
      const el=document.getElementById("currentPeriod");
      if(nextLabel!==lastMainLabel){el.classList.remove("period-flash");void el.offsetWidth;el.classList.add("period-flash");}
      el.innerHTML=nextLabel;lastMainLabel=nextLabel;
    }

    function getScheduleCatalog(){return activeSchoolConfig?.schedule||{};}

    function getCalendarLogicEvents(){
      return activeSchoolConfig?.calendar?.useForSchoolYear===true ? calendarEvents : [];
    }

    function getFirstDayEvents(){
      return getCalendarLogicEvents().filter(isFirstDayOfSchoolEvent).sort((a,b)=>a.start.getTime()-b.start.getTime());
    }

    function getFirstDayForStartYear(startYear){
      const matches=getFirstDayEvents().filter(evt=>evt.start.getFullYear()===startYear);
      return matches.length?matches[0].start:null;
    }

    function getSchoolYearEndForStartYear(startYear){
      const lastDays=getCalendarLogicEvents().filter(isLastDayOfSchoolEvent).sort((a,b)=>a.start.getTime()-b.start.getTime());
      const matchingLast=lastDays.find(evt=>evt.start.getFullYear()===startYear+1);
      if(matchingLast)return formatDate(matchingLast.start);

      if(activeSchoolConfig?.defaults?.schoolYearEndFromNextFirstDay!==false){
        const next=getFirstDayEvents().find(evt=>evt.start.getFullYear()>startYear);
        if(next){
          const end=new Date(next.start.getFullYear(),next.start.getMonth(),next.start.getDate());
          end.setDate(end.getDate()-1);
          return formatDate(end);
        }
      }
      return null;
    }

    function buildSchoolYearData(startYear){
      const firstDay=getFirstDayForStartYear(startYear);
      if(!firstDay)return null;

      const y1=startYear,y2=startYear+1;
      const classesBegin=formatDate(firstDay);
      const classesEnd=getSchoolYearEndForStartYear(startYear);
      const d={label:`${y1}-${y2}`,classesBegin,classesEnd,mondayNoBroadcast:new Set(),pepRallyDays:new Set(),finalsMap:{},noSchoolReasons:{}};

      let c=new Date(classesBegin+"T00:00:00");
      while(c.getDay()!==1)c.setDate(c.getDate()+1);
      for(let i=0;i<3;i++){d.mondayNoBroadcast.add(formatDate(c));c.setDate(c.getDate()+7);}

      [nthWeekday(y1,9,5,4),lastWeekday(y2,0,5),nthWeekday(y2,3,5,4)].forEach(x=>d.pepRallyDays.add(formatDate(x)));
      d.finalsMap[`${y1}-12-17`]="finalsP12";
      d.finalsMap[`${y1}-12-18`]="finalsP34";
      d.finalsMap[`${y1}-12-19`]="finalsP56";
      d.finalsMap[`${y2}-05-26`]="finalsP12";
      d.finalsMap[`${y2}-05-27`]="finalsP34";
      d.finalsMap[`${y2}-05-28`]="finalsP56";

      const yearEndMs=classesEnd?new Date(classesEnd+"T23:59:59").getTime():Infinity;
      const relevantEvents=getCalendarLogicEvents().filter(evt=>{
        const ms=evt.start.getTime();
        const holiday=isNoSchoolEvent(evt)||isThanksgivingBreakEvent(evt)||isWinterBreakEvent(evt);
        return ms>=firstDay.getTime()&&ms<=yearEndMs&&holiday;
      });

      for(const evt of relevantEvents){
        let dates=[formatDate(evt.start)],reason=evt.summary||"No School";
        if(isThanksgivingBreakEvent(evt)){
          dates=addWeekdaysFromStart(evt.start,activeSchoolConfig?.defaults?.breakWeekdays||5);
          reason="Thanksgiving Break";
        }else if(isWinterBreakEvent(evt)){
          dates=addWeekdaysFromStart(evt.start,activeSchoolConfig?.defaults?.breakWeekdays||5);
          reason="Winter Break";
        }
        for(const ds of dates)d.noSchoolReasons[ds]=reason;
      }
      return d;
    }

    function getSchoolYearData(startYear){
      if(!calendarDataLoaded)return null;
      if(!yearDataCache.has(startYear))yearDataCache.set(startYear,buildSchoolYearData(startYear));
      return yearDataCache.get(startYear);
    }

    function getYearDataByDate(ds){
      if(!calendarDataLoaded)return null;
      const year=Number(ds.slice(0,4));
      for(const s of [year-1,year]){
        const yData=getSchoolYearData(s);
        if(yData&&ds>=yData.classesBegin&&(!yData.classesEnd||ds<=yData.classesEnd))return yData;
      }
      return null;
    }

    function defaultScheduleKeyForDate(dateObj){
      const catalog=getScheduleCatalog();
      const ds=formatDate(dateObj),y=getYearDataByDate(ds),day=dateObj.getDay();
      if(!calendarDataLoaded)return {type:"closed",reason:"Loading School Calendar",yearLabel:"Loading"};
      if(!y)return {type:"closed",reason:"No School (Outside School Year)",yearLabel:"Outside School Year"};
      if(day===0||day===6)return {type:"closed",reason:"Weekend",yearLabel:y.label};
      if(y.noSchoolReasons[ds])return {type:"closed",reason:y.noSchoolReasons[ds],yearLabel:y.label};
      if(y.finalsMap[ds]&&catalog[y.finalsMap[ds]])return {type:"schedule",key:y.finalsMap[ds],yearLabel:y.label};
      if(y.pepRallyDays.has(ds)&&catalog.pepRally)return {type:"schedule",key:"pepRally",yearLabel:y.label};
      if(day===1&&catalog.mondayBroadcast&&catalog.mondayNoBroadcast){
        return y.mondayNoBroadcast.has(ds)?{type:"schedule",key:"mondayNoBroadcast",yearLabel:y.label}:{type:"schedule",key:"mondayBroadcast",yearLabel:y.label};
      }
      if(catalog.regularTF)return {type:"schedule",key:"regularTF",yearLabel:y.label};
      const firstKey=Object.keys(catalog)[0];
      return firstKey?{type:"schedule",key:firstKey,yearLabel:y.label}:{type:"closed",reason:"No Schedule Configured",yearLabel:y.label};
    }

    function getScheduleKeyForDate(dateObj){
      const custom=activeSchoolConfig?.logic?.getScheduleKeyForDate;
      return typeof custom==="function"?custom(dateObj,{config:activeSchoolConfig,calendarEvents,getScheduleCatalog,formatDate,yearData:getYearDataByDate}):defaultScheduleKeyForDate(dateObj);
    }

    function getMarkersForDate(dateObj){
      const ds=formatDate(dateObj),y=getYearDataByDate(ds);
      if(!y)return ["noschool"];
      const marks=[];
      if(y.finalsMap[ds])marks.push("finals");
      if(y.pepRallyDays.has(ds))marks.push("rally");
      if(y.noSchoolReasons[ds]||dateObj.getDay()===0||dateObj.getDay()===6)marks.push("noschool");
      return marks;
    }

    function markerClass(m){
      const f=m.includes("finals"),r=m.includes("rally"),n=m.includes("noschool"),c=[f,r,n].filter(Boolean).length;
      if(c>1)return "filled-multi";if(f)return "filled-finals";if(r)return "filled-rally";if(n)return "filled-noschool";return "";
    }

    function renderScheduleBlocks(s){
      return (s?.blocks||[]).map(b=>`<div class="schedule-item"><strong>${b[0]}</strong> : ${toNormalTime(b[1])} - ${toNormalTime(b[2])}</div>`).join("");
    }

    function isWeekendNowOrAfterSchoolToWeekend(dateObj,info){
      const day=dateObj.getDay();if(day===0||day===6)return true;
      if(info.type==="schedule"&&day===5){
        const sch=getScheduleCatalog()[info.key];
        if(sch?.blocks?.length){
          const lastBlock=sch.blocks[sch.blocks.length-1],lastEndSec=parseTimeToMinutes(lastBlock[2])*60,nowSec=dateObj.getHours()*3600+dateObj.getMinutes()*60+dateObj.getSeconds();
          if(nowSec>=lastEndSec)return true;
        }
      }
      return false;
    }

    function applyState({labelHtml,endText,cdText}){
      setMainLabel(labelHtml);
      document.getElementById("endTime").innerText=endText;
      document.getElementById("countdown").innerText=cdText;
    }

    function update(){
      if(!calendarDataLoaded){
        setMainLabel("Loading school calendar...");
        document.getElementById("endTime").innerText="";
        document.getElementById("countdown").innerText="";
        return;
      }

      const now=getNow(),todayText=fullDate(formatDate(now)),info=getScheduleKeyForDate(now);
      if(info.type==="closed"){
        applyState({labelHtml:`<span class="holiday">${info.reason}</span>`,endText:todayText,cdText:""});
        return;
      }

      const sch=getScheduleCatalog()[info.key];
      if(!sch?.blocks?.length){
        applyState({labelHtml:"School is Out",endText:todayText,cdText:""});
        return;
      }

      const nowSec=now.getHours()*3600+now.getMinutes()*60+now.getSeconds(),firstSec=parseTimeToMinutes(sch.blocks[0][1])*60,passingBeforeFirstSec=firstSec-6*60;

      if(nowSec<firstSec){
        if(nowSec>=passingBeforeFirstSec){
          const firstLabel=getPeriodLabel(sch.blocks[0][0]);
          applyState({labelHtml:"Passing Period",endText:`${firstLabel} starts at ${toNormalTime(sch.blocks[0][1])}`,cdText:`Starts in: ${formatDuration(firstSec-nowSec)}`});
          return;
        }
        const passingStartSec=passingBeforeFirstSec;
        const passingStartTime=toNormalTime(`${String(Math.floor(passingStartSec/3600)).padStart(2,"0")}:${String(Math.floor((passingStartSec%3600)/60)).padStart(2,"0")}`);
        applyState({labelHtml:"Before School",endText:`Passing Period starts at ${passingStartTime}`,cdText:`Starts in: ${formatDuration(passingStartSec-nowSec)}`});
        return;
      }

      for(let i=0;i<sch.blocks.length;i++){
        const [name,s,e]=sch.blocks[i],sm=parseTimeToMinutes(s)*60,em=parseTimeToMinutes(e)*60;
        if(nowSec>=sm&&nowSec<em){
          applyState({labelHtml:name,endText:`Ends at ${toNormalTime(e)}`,cdText:`Time remaining: ${formatDuration(Math.max(0,em-nowSec))}`});
          return;
        }
        if(i<sch.blocks.length-1){
          const next=sch.blocks[i+1],nm=parseTimeToMinutes(next[1])*60;
          if(nowSec>=em&&nowSec<nm){
            const nextLabel=getPeriodLabel(next[0]);
            applyState({labelHtml:"Passing Period",endText:`${nextLabel} starts at ${toNormalTime(next[1])}`,cdText:`Starts in: ${formatDuration(Math.max(0,nm-nowSec))}`});
            return;
          }
        }
      }

      if(isWeekendNowOrAfterSchoolToWeekend(now,info))applyState({labelHtml:`<span class="holiday">Weekend</span>`,endText:todayText,cdText:""});
      else applyState({labelHtml:"School is Out",endText:todayText,cdText:""});
    }

    function scheduleFit(){fitContainer();setTimeout(fitContainer,300);setTimeout(fitContainer,700);}

    function setDevTime(){
      const input=document.getElementById("devTimeInput");if(!input)return;
      const raw=(input.value||"").trim();if(!/^\d{6}$/.test(raw))return;
      const h=Number(raw.slice(0,2)),m=Number(raw.slice(2,4)),s=Number(raw.slice(4,6));if(h>23||m>59||s>59)return;
      const now=new Date(),target=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m,s);
      devTimeOffsetMs=target.getTime()-Date.now();devTimeActive=true;update();
    }

    function resetDevTime(){devTimeActive=false;devTimeOffsetMs=0;update();}

    function toggleToday(){
      const p=document.getElementById("todayPanel");p.classList.toggle("show");
      const now=getNow(),info=getScheduleKeyForDate(now),dateLabel=prettyDate(formatDate(now));
      if(info.type==="closed")p.innerHTML=`<div class="schedule-item"><strong>${dateLabel}</strong><span class="badge">${info.yearLabel}</span></div><div class="schedule-item holiday">${info.reason}</div>`;
      else {const s=getScheduleCatalog()[info.key];p.innerHTML=`<div class="schedule-item"><strong>${s.title}</strong><span class="badge">${info.yearLabel}</span></div>${renderScheduleBlocks(s)}`;}
      scheduleFit();
    }

    function renderAllSchedulesList(){
      const panel=document.getElementById("allPanel"),catalog=getScheduleCatalog(),keys=Object.keys(catalog);let html=`<div><strong>Click a schedule type:</strong></div>`;
      for(const key of keys){const s=catalog[key];html+=`<button class="schedule-link ${activeScheduleKey===key?"active-btn":""}" onclick="toggleInlineSchedule('${key}',event)">${s.title}</button><div class="inline-detail ${activeScheduleKey===key?"show":""}" id="detail-${key}">${renderScheduleBlocks(s)}</div>`;}
      panel.innerHTML=html;
    }

    function toggleInlineSchedule(key,ev){
      if(ev?.currentTarget){const btn=ev.currentTarget;btn.classList.remove("click-animate");void btn.offsetWidth;btn.classList.add("click-animate");}
      activeScheduleKey=activeScheduleKey===key?null:key;renderAllSchedulesList();scheduleFit();
    }

    function toggleAll(){
      const p=document.getElementById("allPanel");p.classList.toggle("show");if(p.classList.contains("show"))renderAllSchedulesList();scheduleFit();
    }

    function monthName(m){return new Date(2000,m,1).toLocaleString(undefined,{month:"long"});}

    function renderCalendar(){
      const grid=document.getElementById("calGrid"),title=document.getElementById("calTitle");
      const y=calendarViewDate.getFullYear(),m=calendarViewDate.getMonth();title.textContent=`${monthName(m)} ${y}`;grid.innerHTML="";
      ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(d=>{const e=document.createElement("div");e.className="cal-dow";e.textContent=d;grid.appendChild(e);});
      const firstDay=new Date(y,m,1).getDay(),daysInMonth=new Date(y,m+1,0).getDate(),today=formatDate(getNow());
      for(let i=0;i<firstDay;i++){const b=document.createElement("button");b.className="cal-day muted";b.disabled=true;grid.appendChild(b);}
      for(let day=1;day<=daysInMonth;day++){
        const d=new Date(y,m,day),ds=formatDate(d),marks=getMarkersForDate(d);const b=document.createElement("button");b.className="cal-day";
        const mc=markerClass(marks);if(mc)b.classList.add(mc);if(ds===today)b.classList.add("today");if(ds===selectedDateStr)b.classList.add("selected");
        const dayNum=document.createElement("div");dayNum.textContent=day;b.appendChild(dayNum);
        const events=calendarEventsByDate.get(ds)||[];
        if(events.length){const dots=document.createElement("div");dots.className="event-dots";events.forEach(()=>{const dot=document.createElement("span");dot.className="event-dot";dots.appendChild(dot);});b.appendChild(dots);}
        b.onclick=()=>{selectedDateStr=ds;renderCalendar();showCalendarInfo(ds);fitContainer();};grid.appendChild(b);
      }
      if(selectedDateStr)showCalendarInfo(selectedDateStr);else document.getElementById("calendarInfo").innerHTML="";fitContainer();
    }

    function showCalendarInfo(ds){
      const el=document.getElementById("calendarInfo"),d=new Date(ds+"T00:00:00"),info=getScheduleKeyForDate(d);let html="";
      if(info.type==="closed")html=`<strong>${prettyDate(ds)}</strong><br><span class="holiday">${info.reason}</span>`;
      else {const s=getScheduleCatalog()[info.key];html=`<strong>${prettyDate(ds)}</strong><br>${s.title}`;}
      const events=calendarEventsByDate.get(ds)||[];
      if(events.length){const list=events.map(evt=>`<div class="event-item"><span class="event-time">${evt.timeLabel}</span>${escapeHtml(evt.summary)}</div>`).join("");html+=`<div class="event-list">${list}</div>`;}
      el.innerHTML=html;
    }

    function changeMonth(delta){calendarViewDate=new Date(calendarViewDate.getFullYear(),calendarViewDate.getMonth()+delta,1);selectedDateStr=null;renderCalendar();}
    function goToCurrentMonth(){const n=getNow();calendarViewDate=new Date(n.getFullYear(),n.getMonth(),1);selectedDateStr=null;renderCalendar();}
    function toggleCalendar(){
      if(activeSchoolConfig?.calendar?.show!==true)return;
      calendarVisible=!calendarVisible;
      applyCalendarVisibility();
      scheduleFit();
    }

    function fitContainer(){
      const c=document.getElementById("mainContainer");c.classList.remove("allow-scroll");const max=Math.floor(innerHeight*.94);c.style.maxHeight=`${max}px`;
      requestAnimationFrame(()=>{c.classList.toggle("allow-scroll",c.scrollHeight>c.clientHeight+1);});
    }

    function applyCalendarVisibility(){
      const show=activeSchoolConfig?.calendar?.show===true;
      const card=document.getElementById("calendarCard");
      const button=document.getElementById("calendarToggleBtn");
      if(card)card.classList.toggle("hidden",!show || !calendarVisible);
      if(button)button.style.display=show?"":"none";
      document.getElementById("topGrid")?.classList.toggle("calendar-visible",show && calendarVisible);
      if(button)button.textContent=calendarVisible?"Hide Calendar":"Show Calendar";
    }

    function resetSchoolUi(){
      document.getElementById("todayPanel")?.classList.remove("show");
      document.getElementById("allPanel")?.classList.remove("show");
      document.getElementById("todayPanel").innerHTML="";
      document.getElementById("allPanel").innerHTML="";
      document.getElementById("devPanel")?.classList.remove("show");
      activeScheduleKey=null;
      lastMainLabel="";
      calendarViewDate=new Date();
      selectedDateStr=null;
      calendarVisible=false;
      document.getElementById("calendarCard")?.classList.add("hidden");
      document.getElementById("topGrid")?.classList.remove("calendar-visible");
      const calBtn=document.getElementById("calendarToggleBtn");if(calBtn)calBtn.textContent="Show Calendar";
      applyCalendarVisibility();
    }

    function initSchoolApp(slug){
      if(!slug||!SCHOOL_CONFIGS[slug])return;
      const config=getSchoolConfig(slug);
      activeSchoolSlug=slug;
      activeSchoolConfig=config;

      const schoolNameHeader=document.getElementById("schoolNameHeader");
      if(schoolNameHeader)schoolNameHeader.textContent=config.name||SCHOOL_ROUTES[slug]?.name||slug;

      resetSchoolUi();
      applyCalendarVisibility();
      calendarEventsByDate=new Map();
      calendarEvents=[];
      calendarDataLoaded=false;
      yearDataCache.clear();

      if(devMode)document.getElementById("devPanel")?.classList.add("show");
      update();
      fitContainer();
      renderCalendar();
      loadCalendarEvents();

      if(updateIntervalId===null){
        updateIntervalId=setInterval(()=>{
          if(getCurrentSchoolSlug()===activeSchoolSlug)update();
        },250);
      }
    }

    addEventListener("popstate",routeSchool);
    document.getElementById("mainContainer").addEventListener("transitionend",event=>{
      if(event.target?.classList?.contains("panel")||event.target?.classList?.contains("inline-detail"))fitContainer();
    });
    addEventListener("resize",fitContainer);

    // GitHub Pages sends unknown deep links to 404.html. That tiny fallback
    // stores the requested URL here before returning to this single app file.
    const githubPagesRedirect=sessionStorage.getItem("githubPagesRedirect");
    if(githubPagesRedirect){
      sessionStorage.removeItem("githubPagesRedirect");
      try{
        const target=new URL(githubPagesRedirect,location.origin);
        history.replaceState(null,"",target.pathname+target.search+target.hash);
      }catch{}
    }

    routeSchool();
  </script>
</body>
</html>
